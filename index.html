<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player — CodeAlpha Task 4</title>
  <meta name="description" content="A music player built with HTML, CSS and JavaScript: tap a song to open the full player, with play, pause, next, previous, progress bar, volume control and a playlist." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="appbar">
    <a class="brand" href="#playlist">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      </span>
      <span class="brand-name">Music Player</span>
    </a>
    <div class="appbar-actions">
      <button class="icon-btn" id="autoplayToggle" type="button" aria-pressed="true" aria-label="Autoplay on" title="Autoplay">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
      <button class="icon-btn" id="folderBtn" type="button" aria-label="Add music folder" title="Add music folder">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
      </button>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle light and dark mode">☀</button>
    </div>
  </header>

  <main>
    <section class="playlist-section" aria-label="Playlist">
      <h2>Your Songs</h2>
      <p class="section-lead">Tap a track to open the player.</p>
      <div class="list-filters" role="group" aria-label="Song lists">
        <button class="filter-chip active" data-view="all" type="button">All songs</button>
        <button class="filter-chip" data-view="liked" type="button">♥ Liked</button>
        <button class="filter-chip" data-view="folder" id="folderChip" type="button" hidden>Folder</button>
      </div>
      <div class="folder-row">
        <button class="list-import-btn" id="importBtn" type="button" aria-label="Import audio files">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>Import</span>
        </button>
        <button class="remove-folder-btn" id="removeFolderBtn" type="button" hidden>Remove folder</button>
      </div>
      <ol class="playlist" id="playlist"></ol>
      <input type="file" id="folderInput" webkitdirectory multiple accept="audio/*" hidden>
      <input type="file" id="importInput" multiple accept="audio/*" hidden>
    </section>
  </main>

  <div class="mini-player" id="miniPlayer" hidden>
    <span class="mini-progress" aria-hidden="true"><span class="mini-progress-fill" id="miniProgressFill"></span></span>
    <button class="mini-open" id="miniOpen" type="button" aria-label="Open player">
      <span class="mini-disc" id="miniDisc" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      </span>
      <span class="mini-info">
        <span class="mini-title" id="miniTitle">—</span>
        <span class="mini-artist" id="miniArtist">—</span>
      </span>
    </button>
    <button class="mini-play" id="miniPlayBtn" type="button" aria-label="Play">
      <svg id="miniPlayIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg id="miniPauseIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <section class="drawer" id="playerDrawer" aria-label="Now playing" aria-hidden="true">
    <div class="drawer-top" id="drawerTop">
      <button class="drawer-back" id="drawerBack" type="button" aria-label="Back to songs">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </button>
      <button class="drawer-like" id="likeBtn" type="button" aria-pressed="false" aria-label="Like this song">
        <svg id="likeIconOutline" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <svg id="likeIconFilled" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true" hidden><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
    </div>
    <div class="player" id="player">
      <div class="disc-wrap">
        <div class="disc" id="disc" aria-hidden="true">
          <span class="disc-ring"></span>
          <svg class="disc-trail" viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <linearGradient id="trailFade" gradientUnits="userSpaceOnUse" x1="170" y1="30" x2="14.3" y2="50.5">
                <stop offset="0%" stop-color="#f5f5f5" stop-opacity="0.85" />
                <stop offset="100%" stop-color="#f5f5f5" stop-opacity="0" />
              </linearGradient>
            </defs>
            <path d="M 170 30 A 99 99 0 0 0 14.3 50.5" fill="none" stroke="url(#trailFade)" stroke-width="10" stroke-linecap="round" />
          </svg>
          <span class="disc-dot"></span>
          <span class="disc-label"></span>
        </div>
      </div>

      <p class="now-playing" id="nowPlaying">Now playing</p>
      <h1 id="trackTitle">No song yet</h1>
      <p class="artist" id="trackArtist" style="display: none"></p>
      <p class="status" id="status" role="status"></p>

      <div class="progress" id="progressBar" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-knob" id="progressKnob"></div>
      </div>
      <div class="times">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>

      <div class="controls">
        <button class="control-btn" id="prevBtn" type="button" aria-label="Previous track">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button class="control-btn play-btn" id="playBtn" type="button" aria-label="Play">
          <svg id="playIcon" viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button class="control-btn" id="nextBtn" type="button" aria-label="Next track">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
        </button>
      </div>

      <div class="volume">
        <button class="volume-btn" id="muteBtn" type="button" aria-label="Mute or unmute">
          <svg id="volumeIcon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          <svg id="muteIcon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        </button>
        <input type="range" id="volumeSlider" min="0" max="100" value="80" aria-label="Volume" />
        <span class="volume-max" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg></span>
      </div>
    </div>
  </section>

  <audio id="audio" preload="metadata"></audio>
  <script src="script.js"></script>
</body>
</html>
